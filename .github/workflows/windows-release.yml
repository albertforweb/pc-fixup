name: Windows Build and Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Windows x64
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure Release build
        run: cmake -S . -B build/release -A x64 -DCMAKE_BUILD_TYPE=Release

      - name: Build application
        run: cmake --build build/release --config Release --target WindowsSpeedMaster

      - name: Stage and package release files
        shell: pwsh
        run: |
          cmake --install build/release --config Release --prefix dist
          Compress-Archive -Path dist/WindowsSpeedMaster.exe -DestinationPath dist/WindowsSpeedMaster-windows-x64.zip -CompressionLevel Optimal
          $hash = (Get-FileHash dist/WindowsSpeedMaster.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  WindowsSpeedMaster.exe" | Set-Content -Encoding ascii dist/WindowsSpeedMaster.exe.sha256

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: WindowsSpeedMaster-windows-x64
          path: |
            dist/WindowsSpeedMaster.exe
            dist/WindowsSpeedMaster-windows-x64.zip
            dist/WindowsSpeedMaster.exe.sha256
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: WindowsSpeedMaster-windows-x64
          path: dist

      - name: Create release and attach files
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            $releaseTag = $env:GITHUB_REF_NAME
            $releaseTitle = $releaseTag
            $prerelease = $false
          } else {
            $shortSha = $env:GITHUB_SHA.Substring(0, 12)
            $releaseTag = "main-$shortSha"
            $releaseTitle = "Main build $shortSha"
            $prerelease = $true
          }

          $ghArgs = @(
            "release", "create", $releaseTag,
            "dist/WindowsSpeedMaster.exe",
            "dist/WindowsSpeedMaster-windows-x64.zip",
            "dist/WindowsSpeedMaster.exe.sha256",
            "--target", $env:GITHUB_SHA,
            "--title", $releaseTitle,
            "--generate-notes"
          )
          if ($env:GITHUB_REF_TYPE -eq "tag") { $ghArgs += "--verify-tag" }
          if ($prerelease) { $ghArgs += "--prerelease" }
          gh @ghArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
