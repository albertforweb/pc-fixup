name: Windows Build and Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Windows x64
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure Release build
        run: cmake -S . -B build/release -A x64 -DCMAKE_BUILD_TYPE=Release

      - name: Build application
        run: cmake --build build/release --config Release --target WinStartReview

      - name: Stage and package release files
        shell: pwsh
        run: |
          cmake --install build/release --config Release --prefix dist
          Compress-Archive -Path dist/WinStartReview.exe -DestinationPath dist/WinStartReview-windows-x64.zip -CompressionLevel Optimal
          $hash = (Get-FileHash dist/WinStartReview.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  WinStartReview.exe" | Set-Content -Encoding ascii dist/WinStartReview.exe.sha256

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: WinStartReview-windows-x64
          path: |
            dist/WinStartReview.exe
            dist/WinStartReview-windows-x64.zip
            dist/WinStartReview.exe.sha256
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: WinStartReview-windows-x64
          path: dist

      - name: Create release and attach files
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$env:GITHUB_REF_NAME"
          dist/WinStartReview.exe
          dist/WinStartReview-windows-x64.zip
          dist/WinStartReview.exe.sha256
          --verify-tag
          --title "$env:GITHUB_REF_NAME"
          --generate-notes
